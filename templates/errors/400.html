{% extends 'base.html' %}

{% block title %}400 Bad Request — CrimeConnect{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; text-align: center; padding: 60px 20px;">
  <div style="font-size: 4rem; color: var(--warning-amber); margin-bottom: 16px;">
    <i class="fa-solid fa-triangle-exclamation"></i>
  </div>
  <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 12px;">400 — Bad Request</h1>
  <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 24px;">
    The server could not understand the request, possibly due to an invalid form submission or expired CSRF session token.
  </p>
  <div style="display: flex; justify-content: center; gap: 12px;">
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
      <i class="fa-solid fa-house"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
