{% extends 'base.html' %}

{% block title %}404 Not Found — CrimeConnect{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; text-align: center; padding: 60px 20px;">
  <div style="font-size: 4rem; color: var(--accent-blue); margin-bottom: 16px;">
    <i class="fa-solid fa-compass"></i>
  </div>
  <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 12px;">404 — Page Not Found</h1>
  <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 24px;">
    The requested incident page, case file, or endpoint does not exist or may have been relocated.
  </p>
  <div style="display: flex; justify-content: center; gap: 12px;">
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
      <i class="fa-solid fa-house"></i> Return Home
    </a>
    <a href="{{ url_for('complaints.track_complaint') }}" class="btn btn-outline">
      <i class="fa-solid fa-magnifying-glass"></i> Track Complaint
    </a>
  </div>
</div>
{% endblock %}
